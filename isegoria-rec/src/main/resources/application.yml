server:
  port: 8206                # user=8201 post=8202 interaction=8203 social=8204 notify=8205 rec=8206
  servlet:
    context-path: /api
  error:
    include-stacktrace: always
    include-message: always

spring:
  application:
    name: isegoria-rec    # 与 dubbo.application.name 一致
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/frorum?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456         # 敏感配置建议后续移入 application-local.yml
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  rabbitmq:
    host: localhost
    port: 5672
    username: root
    password: 123456
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
  # es
  elasticsearch:
    uris: http://localhost:9200
    connection-timeout: 3s
    socket-timeout: 60s

# ===== 跨域白名单（CorsConfig 读取；严禁 *，allowCredentials=true 下等同任意站点可带 Cookie） =====
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:5174
    - http://127.0.0.1:3000



# ===== Dubbo（六服务差异仅 protocol.port：50051~50056）=====
dubbo:
  application:
    name: isegoria-rec
    register-mode: instance   # 应用级注册；Dubbo 只读 dubbo.application.register-mode 这一条路径
  registry:
    address: nacos://127.0.0.1:8848?username=nacos&password=nacos
  protocol:
    name: tri
    port: 50056
  consumer:
    timeout: 5000
    check: false            # 启动不强制依赖方在线，避免启动顺序耦合
  provider:
    timeout: 5000

# ===== Sa-Token（六服务必须逐字一致——共享登录态的根基）=====
sa-token:
  token-name: isegoria
  timeout: 7200
  active-timeout: 1800
  is-concurrent: true
  is-share: true
  token-style: uuid
  cookie:
    path: /
    secure: false
    http-only: true
    same-site: Lax

# ===== MyBatis-Plus（六服务一致；注意 global-config 与 configuration 平级，勿缩进进 configuration）=====
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.ruwei: debug

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ruwei.rec.controller

knife4j:
  enable: true
  setting:
    language: zh_cn

rec:
  # ---- 精排：pScore = hotScore × (1 + α·tagAffinity + β·typeAffinity + γ·boardAffinity) ----
  fine:
    topic: 0.3          # α 标签亲和系数（rec.fine.topic）
    type: 0.2           # β 内容形态亲和系数（rec.fine.type）
    board: 0.1          # γ 板块亲和系数（rec.fine.board）
    cold-floor: 1.0     # 冷启动帖精排保底分（rec.fine.cold-floor）：新帖无互动时保证能进首屏
  # ---- 粗排 ----
  rough:
    top: 300            # 热度截断：候选按 score 降序保留 Top N（rec.rough.top）
  # ---- 召回五路上限 ----
  recall:
    follow-limit: 200   # 路① 关注流上限（rec.recall.follow-limit）
    board-limit: 200    # 路② 板块流上限（rec.recall.board-limit）
    hot-limit: 100      # 路③ 热点流上限（rec.recall.hot-limit）
    tag-limit: 150      # 路④ 标签流上限（rec.recall.tag-limit）
    cold-limit: 100     # 路⑤ 冷启动上限（rec.recall.cold-limit）
  # ---- 冷启动 ----
  cold:
    window-hours: 72    # 冷启动召回窗口（小时，rec.cold.window-hours）：先审后发审核有延迟，24h→72h 防新帖召回错过
    view-threshold: 50  # viewCount 低于该值视为新帖候选（rec.cold.view-threshold）
  # ---- 兴趣信号强度（RecInterestConsumer）----
  interest:
    view-delta: 0.2     # 浏览弱信号增量；点赞/评论/分享为 1.0 强信号（rec.interest.view-delta）