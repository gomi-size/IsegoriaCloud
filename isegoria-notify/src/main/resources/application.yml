server:
  port: 8205               # user=8201 post=8202 interaction=8203 social=8204 notify=8205 rec=8206
  servlet:
    context-path: /api
  error:
    include-stacktrace: always
    include-message: always

spring:
  application:
    name: isegoria-notify     # 与 dubbo.application.name 一致
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/frorum?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456         # 敏感配置建议后续移入 application-local.yml
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  rabbitmq:
    host: localhost
    port: 5672
    username: root
    password: 123456
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0

# ===== 跨域白名单（CorsConfig 读取；严禁 *，allowCredentials=true 下等同任意站点可带 Cookie） =====
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:5174
    - http://127.0.0.1:3000

# ===== 内网边界（P3）：只接受经过网关的请求（网关注入 SA-SAME-TOKEN 头）=====
# 默认关闭：本机 IDE 直连 8205 调试不受影响。
# 打开时机：Nginx 已把 /api/ 切到网关、且回归跑通之后（Docker 里用 GATEWAY_SAME_TOKEN_ENABLED=true 统一覆盖）。
# 若在本机直连调试又要打开它：同时加 allow-localhost: true（放行回环地址）。
gateway:
  same-token:
    enabled: false

# ===== Dubbo（六服务差异仅 protocol.port：50051~50056）=====
dubbo:
  application:
    # QoS 运维端口：六服务同机部署必须互不相同（默认都是 22222，第二个启动的服务会 BindException）
    qos-port: 33335
    name: isegoria-notify
    register-mode: instance   # 应用级注册；Dubbo 只读 dubbo.application.register-mode 这一条路径
  registry:
    address: nacos://127.0.0.1:8848?username=nacos&password=nacos
  protocol:
    name: tri
    port: 50055
  consumer:
    timeout: 5000
    check: false            # 启动不强制依赖方在线，避免启动顺序耦合
  provider:
    timeout: 5000

# ===== Sa-Token（六服务必须逐字一致——共享登录态的根基）=====
sa-token:
  token-name: isegoria
  timeout: 7200
  active-timeout: 1800
  is-concurrent: true
  is-share: true
  token-style: uuid
  cookie:
    path: /
    secure: false
    http-only: true
    same-site: Lax

# ===== MyBatis-Plus（六服务一致；注意 global-config 与 configuration 平级，勿缩进进 configuration）=====
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: false
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.ruwei: debug

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ruwei.notify.controller

knife4j:
  enable: true
  setting:
    language: zh_cn